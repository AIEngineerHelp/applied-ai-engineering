<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="405" fill="#ffffff"/>
  <text x="40" y="44" font-size="16" font-weight="700" fill="#111827">Live Tracking 2.0 rollout</text>
  <line x1="60" y1="150" x2="670" y2="150" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <!-- phase markers -->
  <g font-size="12">
    <circle cx="100" cy="150" r="11" fill="#2563eb"/>
    <text x="100" y="120" text-anchor="middle" font-weight="700" fill="#1e3a8a">Jul 14</text>
    <circle cx="270" cy="150" r="11" fill="#2563eb"/>
    <text x="270" y="120" text-anchor="middle" font-weight="700" fill="#1e3a8a">Aug 4</text>
    <circle cx="450" cy="150" r="11" fill="#2563eb"/>
    <text x="450" y="120" text-anchor="middle" font-weight="700" fill="#1e3a8a">Sep 1</text>
    <circle cx="630" cy="150" r="11" fill="#475569"/>
    <text x="630" y="120" text-anchor="middle" font-weight="700" fill="#334155">Oct 31</text>
  </g>
  <!-- phase cards -->
  <g font-size="11" fill="#374151">
    <rect x="40" y="180" width="140" height="150" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="54" y="204" font-size="12" font-weight="700" fill="#1e3a8a">Phase 1 · Pilot</text>
    <text x="54" y="226">12 pilot customers</text>
    <text x="54" y="244">Laredo and Detroit</text>
    <text x="54" y="262">corridors only</text>
    <rect x="200" y="180" width="140" height="150" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="214" y="204" font-size="12" font-weight="700" fill="#1e3a8a">Phase 2 · Cross-border</text>
    <text x="214" y="226">All cross-border</text>
    <text x="214" y="244">lanes, Growth and</text>
    <text x="214" y="262">Enterprise accounts</text>
    <rect x="380" y="180" width="140" height="150" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="394" y="204" font-size="12" font-weight="700" fill="#1e3a8a">Phase 3 · Everyone</text>
    <text x="394" y="226">All lanes,</text>
    <text x="394" y="244">all plans</text>
    <text x="394" y="262">including Starter</text>
    <rect x="560" y="180" width="140" height="150" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="574" y="204" font-size="12" font-weight="700" fill="#334155">Legacy page retired</text>
    <text x="574" y="226">Old tracking URL</text>
    <text x="574" y="244">redirects to the</text>
    <text x="574" y="262">new map</text>
  </g>
  <rect x="200" y="350" width="320" height="30" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="360" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">SLA addendum required before Phase 2 migration</text>
</svg>
