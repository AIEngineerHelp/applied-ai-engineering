<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Late deliveries by primary cause, Q3 2026">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#1f2933">Late deliveries by primary cause, Q3 2026</text>
  <text x="32" y="60" font-size="12.5" fill="#6b7280">Share of tagged late shipments. Each shipment has one primary cause.</text>
  <rect x="40.0" y="120" width="262.4" height="64" fill="#3b6fb6"/>
  <text x="171.2" y="157.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">41%</text>
  <rect x="302.4" y="120" width="147.2" height="64" fill="#5b9bd5"/>
  <text x="376.0" y="157.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">23%</text>
  <rect x="449.6" y="120" width="115.2" height="64" fill="#d08a3c"/>
  <text x="507.2" y="157.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">18%</text>
  <rect x="564.8" y="120" width="70.4" height="64" fill="#8e6bbf"/>
  <text x="600.0" y="157.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">11%</text>
  <rect x="635.2" y="120" width="44.8" height="64" fill="#9ca3af"/>
  <text x="657.6" y="157.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7%</text>
  <text x="40.0" y="202" font-size="11" fill="#6b7280" text-anchor="middle">0%</text>
  <text x="200.0" y="202" font-size="11" fill="#6b7280" text-anchor="middle">25%</text>
  <text x="360.0" y="202" font-size="11" fill="#6b7280" text-anchor="middle">50%</text>
  <text x="520.0" y="202" font-size="11" fill="#6b7280" text-anchor="middle">75%</text>
  <text x="680.0" y="202" font-size="11" fill="#6b7280" text-anchor="middle">100%</text>
  <rect x="40" y="239" width="14" height="14" rx="3" fill="#3b6fb6"/>
  <text x="62" y="250" font-size="13" fill="#1f2933">Customs clearance <tspan font-weight="700">41%</tspan></text>
  <rect x="260" y="239" width="14" height="14" rx="3" fill="#5b9bd5"/>
  <text x="282" y="250" font-size="13" fill="#1f2933">Carrier capacity <tspan font-weight="700">23%</tspan></text>
  <rect x="480" y="239" width="14" height="14" rx="3" fill="#d08a3c"/>
  <text x="502" y="250" font-size="13" fill="#1f2933">Weather <tspan font-weight="700">18%</tspan></text>
  <rect x="40" y="273" width="14" height="14" rx="3" fill="#8e6bbf"/>
  <text x="62" y="284" font-size="13" fill="#1f2933">Address errors <tspan font-weight="700">11%</tspan></text>
  <rect x="260" y="273" width="14" height="14" rx="3" fill="#9ca3af"/>
  <text x="282" y="284" font-size="13" fill="#1f2933">Other <tspan font-weight="700">7%</tspan></text>
  <text x="40" y="336" font-size="11" fill="#6b7280">Base: 152,600 late shipments with a primary cause tag, July to September 2026.</text>
</svg>
