<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="405" fill="#ffffff"/>
  <text x="40" y="40" font-size="16" font-weight="700" fill="#111827">Median ETA error, cross-border lanes</text>
  <text x="40" y="60" font-size="11" fill="#6b7280">Hours between predicted and actual delivery · June 2026 · 18,400 shipments</text>
  <!-- axes -->
  <g stroke="#e5e7eb">
    <line x1="90" y1="330" x2="680" y2="330"/>
    <line x1="90" y1="270" x2="680" y2="270"/>
    <line x1="90" y1="210" x2="680" y2="210"/>
    <line x1="90" y1="150" x2="680" y2="150"/>
    <line x1="90" y1="90" x2="680" y2="90"/>
  </g>
  <g font-size="10" fill="#9ca3af" text-anchor="end">
    <text x="82" y="334">0 h</text><text x="82" y="274">1 h</text><text x="82" y="214">2 h</text><text x="82" y="154">3 h</text><text x="82" y="94">4 h</text>
  </g>
  <!-- bars: 60 px per hour from y=330 -->
  <rect x="150" y="144" width="120" height="186" rx="4" fill="#94a3b8"/>
  <text x="210" y="134" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">3.1 h</text>
  <text x="210" y="352" text-anchor="middle" font-size="12" fill="#374151">Fixed border allowance</text>
  <text x="210" y="368" text-anchor="middle" font-size="10" fill="#9ca3af">previous estimator</text>
  <rect x="330" y="246" width="120" height="84" rx="4" fill="#2563eb"/>
  <text x="390" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">1.4 h</text>
  <text x="390" y="352" text-anchor="middle" font-size="12" fill="#374151">Live Tracking 2.0</text>
  <text x="390" y="368" text-anchor="middle" font-size="10" fill="#9ca3af">delay model</text>
  <!-- callout -->
  <rect x="510" y="150" width="160" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="590" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">−55%</text>
  <text x="590" y="202" text-anchor="middle" font-size="11" fill="#1e40af">median error</text>
  <text x="590" y="250" text-anchor="middle" font-size="11" fill="#374151">Within ±2 h: 48% → 79%</text>
</svg>
