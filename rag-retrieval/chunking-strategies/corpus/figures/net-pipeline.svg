<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Tracking pipeline architecture">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#1f2933">Tracking pipeline architecture</text>
  <text x="32" y="60" font-size="12.5" fill="#6b7280">How a carrier scan becomes a shipment event and a customer webhook.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <rect x="24" y="110" width="148" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="98.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Carrier feeds</text>
  <text x="98.0" y="155.0" font-size="10.5" fill="#6b7280" text-anchor="middle">SFTP, EDI, partner APIs</text>
  <rect x="196" y="110" width="148" height="62" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="270.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Ingest</text>
  <text x="270.0" y="155.0" font-size="10.5" fill="#6b7280" text-anchor="middle">validate, deduplicate</text>
  <rect x="368" y="110" width="148" height="62" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="442.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Normalizer</text>
  <text x="442.0" y="155.0" font-size="10.5" fill="#6b7280" text-anchor="middle">214 mapping rules</text>
  <rect x="540" y="110" width="148" height="62" rx="8" fill="#eaf5ee" stroke="#2f855a" stroke-width="1.5"/>
  <text x="614.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Event store</text>
  <text x="614.0" y="155.0" font-size="10.5" fill="#6b7280" text-anchor="middle">canonical history</text>
  <line x1="172" y1="141.0" x2="192" y2="141.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="344" y1="141.0" x2="364" y2="141.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="516" y1="141.0" x2="536" y2="141.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="540" y="270" width="148" height="62" rx="8" fill="#fdf3e7" stroke="#d08a3c" stroke-width="1.5"/>
  <text x="614.0" y="298.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Queue</text>
  <text x="614.0" y="315.0" font-size="10.5" fill="#6b7280" text-anchor="middle">buffers deliveries</text>
  <rect x="368" y="270" width="148" height="62" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="442.0" y="298.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Webhook dispatcher</text>
  <text x="442.0" y="315.0" font-size="10.5" fill="#6b7280" text-anchor="middle">signs, retries</text>
  <rect x="196" y="270" width="148" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="270.0" y="298.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Customer endpoints</text>
  <text x="270.0" y="315.0" font-size="10.5" fill="#6b7280" text-anchor="middle">3,870 active</text>
  <line x1="614.0" y1="172" x2="614.0" y2="266" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="301.0" x2="520" y2="301.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="368" y1="301.0" x2="348" y2="301.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="622.0" y="225.0" font-size="10.5" fill="#6b7280">events</text>
  <text x="32" y="376" font-size="11" fill="#6b7280">The queue decouples writes to the event store from delivery, so a slow customer endpoint cannot hold up ingest.</text>
</svg>
