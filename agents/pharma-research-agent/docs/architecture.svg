<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pharma research agent architecture</title>
  <desc>A browser talks to Next.js API routes, which start a durable Vercel Workflow: plan, parallel research sub-agents, synthesis, evals and finalize. Agents call Gemini and four knowledge bases, write every event and file to Postgres, and the browser follows progress over server-sent events.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1f4e8c"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 13.5px; fill: #475569; }
      .h { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .t { font-size: 13px; fill: #334155; }
      .s { font-size: 12px; fill: #64748b; }
      .lane { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; fill: #64748b; }
      .lbl { font-size: 12px; fill: #475569; }
      .lblb { font-size: 12px; fill: #1f4e8c; font-weight: 500; }
      .mono { font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 12px; fill: #334155; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .step { fill: #ffffff; stroke: #1f4e8c; stroke-width: 1.4; }
      .soft { fill: #eef3fa; stroke: #b8c9e0; stroke-width: 1.2; }
      .kb { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .wire { stroke: #475569; stroke-width: 1.4; fill: none; }
      .wireb { stroke: #1f4e8c; stroke-width: 1.6; fill: none; }
      .dash { stroke: #1f4e8c; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f7f8fa"/>

  <text x="40" y="46" class="title">Pharma research agent — architecture</text>
  <text x="40" y="70" class="sub">One research turn, from question to cited answer. Every step is durable: if a function dies, the run resumes from the last completed step.</text>

  <!-- Lane labels -->
  <text x="40" y="110" class="lane">BROWSER AND API</text>
  <text x="336" y="110" class="lane">DURABLE WORKFLOW (VERCEL WORKFLOW)</text>
  <text x="900" y="110" class="lane">MODEL, SKILLS AND KNOWLEDGE BASES</text>

  <!-- Browser -->
  <rect x="40" y="124" width="256" height="150" rx="10" class="box"/>
  <text x="58" y="152" class="h">Chat workspace</text>
  <text x="58" y="176" class="t">Next.js 16 · React 19</text>
  <text x="58" y="200" class="t">Questions and follow-ups</text>
  <text x="58" y="222" class="t">Live activity, streaming answer</text>
  <text x="58" y="244" class="t">Sources, exports, share links</text>
  <text x="58" y="264" class="s">Anonymous workspace cookie</text>

  <!-- API -->
  <rect x="40" y="326" width="256" height="200" rx="10" class="box"/>
  <text x="58" y="354" class="h">API routes</text>
  <text x="58" y="380" class="mono">POST /api/research</text>
  <text x="58" y="398" class="s">kill switch, daily cap, start()</text>
  <text x="58" y="424" class="mono">GET  /api/reports/:id/events</text>
  <text x="58" y="442" class="s">server-sent events, polls every 400 ms,</text>
  <text x="58" y="458" class="s">resumes from the last sequence number</text>
  <text x="58" y="484" class="mono">/export · /share · /files</text>
  <text x="58" y="502" class="s">PDF and Word, public read-only links</text>

  <!-- Browser <-> API -->
  <path d="M130 274 V326" class="wire" marker-end="url(#arrow)"/>
  <path d="M206 326 V274" class="wire" marker-end="url(#arrow)"/>
  <text x="138" y="304" class="lbl">ask</text>
  <text x="214" y="304" class="lbl">events</text>

  <!-- Workflow container -->
  <rect x="336" y="124" width="524" height="586" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- start() arrow -->
  <path d="M296 380 H350" class="wireb" marker-end="url(#arrow-blue)"/>
  <text x="300" y="372" class="lblb">start</text>

  <!-- 1 Plan -->
  <rect x="356" y="144" width="484" height="96" rx="10" class="step"/>
  <circle cx="378" cy="168" r="11" fill="#1f4e8c"/><text x="378" y="172" text-anchor="middle" class="num">1</text>
  <text x="398" y="173" class="h">Plan · orchestrator</text>
  <text x="376" y="198" class="t">Reads the question and a one-line index of skills; splits it into</text>
  <text x="376" y="216" class="t">2–4 subtasks, one knowledge base each. For a follow-up, first decides:</text>
  <text x="376" y="234" class="t"><tspan font-weight="600">research</tspan> (new evidence needed) or <tspan font-weight="600">answer</tspan> (rewrite from earlier turns).</text>

  <!-- 2 Research -->
  <rect x="356" y="268" width="484" height="168" rx="10" class="step"/>
  <circle cx="378" cy="292" r="11" fill="#1f4e8c"/><text x="378" y="296" text-anchor="middle" class="num">2</text>
  <text x="398" y="297" class="h">Research · sub-agents in parallel</text>
  <text x="376" y="322" class="t">Each loads only its assigned skills, runs a bounded tool loop</text>
  <text x="376" y="340" class="t">(at most 6 turns, <tspan class="mono">finish</tspan> forced on the last), and writes a finding.</text>
  <rect x="376" y="356" width="106" height="62" rx="8" class="soft"/>
  <text x="429" y="382" text-anchor="middle" class="t">agent-1</text><text x="429" y="401" text-anchor="middle" class="s">PubMed</text>
  <rect x="492" y="356" width="106" height="62" rx="8" class="soft"/>
  <text x="545" y="382" text-anchor="middle" class="t">agent-2</text><text x="545" y="401" text-anchor="middle" class="s">Trials</text>
  <rect x="608" y="356" width="106" height="62" rx="8" class="soft"/>
  <text x="661" y="382" text-anchor="middle" class="t">agent-3</text><text x="661" y="401" text-anchor="middle" class="s">FDA</text>
  <rect x="724" y="356" width="96" height="62" rx="8" class="soft"/>
  <text x="772" y="382" text-anchor="middle" class="t">agent-4</text><text x="772" y="401" text-anchor="middle" class="s">Web</text>

  <!-- 3 Synthesis -->
  <rect x="356" y="464" width="484" height="96" rx="10" class="step"/>
  <circle cx="378" cy="488" r="11" fill="#1f4e8c"/><text x="378" y="492" text-anchor="middle" class="num">3</text>
  <text x="398" y="493" class="h">Synthesis · writer</text>
  <text x="376" y="518" class="t">Reads the files, not the sub-agents' conversations, and writes one</text>
  <text x="376" y="536" class="t">markdown report; every claim cites a retrieved source id. Streams</text>
  <text x="376" y="554" class="t">its thinking and draft as it writes.</text>

  <!-- 4 Evals + 5 finalize -->
  <rect x="356" y="588" width="320" height="104" rx="10" class="step"/>
  <circle cx="378" cy="612" r="11" fill="#1f4e8c"/><text x="378" y="616" text-anchor="middle" class="num">4</text>
  <text x="398" y="617" class="h">Evals</text>
  <text x="376" y="642" class="t">Citation validity and coverage,</text>
  <text x="376" y="660" class="t">subtasks answered, source diversity,</text>
  <text x="376" y="678" class="t">plus an LLM judge on cited claims</text>
  <rect x="690" y="588" width="150" height="104" rx="10" class="step"/>
  <circle cx="712" cy="612" r="11" fill="#1f4e8c"/><text x="712" y="616" text-anchor="middle" class="num">5</text>
  <text x="732" y="617" class="h">Finalize</text>
  <text x="708" y="642" class="t">Status, duration,</text>
  <text x="708" y="660" class="t">tokens and cost</text>

  <!-- Flow arrows inside the workflow -->
  <path d="M598 240 V268" class="wireb" marker-end="url(#arrow-blue)"/>
  <path d="M598 436 V464" class="wireb" marker-end="url(#arrow-blue)"/>
  <path d="M516 560 V588" class="wireb" marker-end="url(#arrow-blue)"/>
  <path d="M676 640 H690" class="wireb" marker-end="url(#arrow-blue)"/>

  <!-- Answer-mode bypass -->
  <path d="M840 192 H846 V512 H840" class="dash" marker-end="url(#arrow-blue)"/>
  <text x="850" y="352" class="lblb" font-size="11" transform="rotate(90 850 352)" text-anchor="middle">follow-up answered from earlier turns</text>

  <!-- Gemini -->
  <rect x="900" y="124" width="260" height="150" rx="10" class="box"/>
  <text x="918" y="152" class="h">Gemini API</text>
  <text x="918" y="176" class="mono">streamGenerateContent</text>
  <text x="918" y="200" class="t">Thought summaries, text deltas</text>
  <text x="918" y="222" class="t">JSON schema output, function calls</text>
  <text x="918" y="244" class="t">Thought signatures kept across turns</text>
  <text x="918" y="264" class="s">REST, no SDK; every call traced</text>

  <!-- Skills -->
  <rect x="900" y="296" width="260" height="96" rx="10" class="box"/>
  <text x="918" y="324" class="h">Skills layer</text>
  <text x="918" y="348" class="t">5 markdown playbooks</text>
  <text x="918" y="368" class="s">planner sees one line each; a sub-agent</text>
  <text x="918" y="384" class="s">loads the full text only when assigned</text>

  <!-- Knowledge bases -->
  <rect x="900" y="414" width="260" height="210" rx="10" class="box"/>
  <text x="918" y="442" class="h">Knowledge bases</text>
  <rect x="916" y="456" width="228" height="34" rx="6" class="kb"/><text x="930" y="478" class="t">PubMed · NCBI E-utilities</text>
  <rect x="916" y="498" width="228" height="34" rx="6" class="kb"/><text x="930" y="520" class="t">ClinicalTrials.gov · API v2</text>
  <rect x="916" y="540" width="228" height="34" rx="6" class="kb"/><text x="930" y="562" class="t">openFDA · labels and FAERS</text>
  <rect x="916" y="582" width="228" height="34" rx="6" class="kb"/><text x="930" y="604" class="t">Web · Google Search grounding</text>

  <!-- Workflow -> right column -->
  <path d="M860 170 H900" class="wire" marker-end="url(#arrow)"/>
  <text x="866" y="162" class="lbl">calls</text>
  <path d="M860 340 H900" class="wire" marker-end="url(#arrow)"/>
  <text x="866" y="332" class="lbl">load</text>
  <path d="M860 400 H880 V520 H900" class="wire" marker-end="url(#arrow)"/>
  <text x="866" y="392" class="lbl">tools</text>

  <!-- Postgres -->
  <rect x="40" y="750" width="1120" height="118" rx="12" fill="#ffffff" stroke="#1f4e8c" stroke-width="1.4"/>
  <text x="60" y="780" class="h">Postgres · Drizzle ORM</text>
  <text x="60" y="802" class="s">Neon in production, embedded PGlite locally and in tests</text>
  <rect x="380" y="768" width="180" height="82" rx="8" class="soft"/>
  <text x="396" y="792" class="mono" font-weight="600">reports</text>
  <text x="396" y="812" class="s">one row per turn, threaded;</text>
  <text x="396" y="828" class="s">plan, report, evals, usage</text>
  <rect x="572" y="768" width="190" height="82" rx="8" class="soft"/>
  <text x="588" y="792" class="mono" font-weight="600">report_events</text>
  <text x="588" y="812" class="s">keyed, ordered by sequence;</text>
  <text x="588" y="828" class="s">a retried step overwrites its own</text>
  <rect x="774" y="768" width="180" height="82" rx="8" class="soft"/>
  <text x="790" y="792" class="mono" font-weight="600">report_sources</text>
  <text x="790" y="812" class="s">every document retrieved,</text>
  <text x="790" y="828" class="s">the citation targets</text>
  <rect x="966" y="768" width="180" height="82" rx="8" class="soft"/>
  <text x="982" y="792" class="mono" font-weight="600">report_files</text>
  <text x="982" y="812" class="s">the virtual file system:</text>
  <text x="982" y="828" class="s">plan, findings, report</text>

  <!-- Workflow -> DB, DB -> API -->
  <path d="M598 710 V750" class="wireb" marker-end="url(#arrow-blue)"/>
  <text x="606" y="734" class="lblb">every event, source and file (non-blocking sink)</text>
  <path d="M168 750 V526" class="wire" marker-end="url(#arrow)"/>
  <text x="176" y="640" class="lbl">new events</text>
  <text x="176" y="656" class="lbl">since last seq</text>
</svg>
