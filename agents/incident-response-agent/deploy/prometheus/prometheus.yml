# Prometheus (compose `observability` profile).
# In Kubernetes use the Helm chart's ServiceMonitor (metrics.serviceMonitor.enabled) and load
# deploy/prometheus/alerts.yml as a PrometheusRule instead.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: ira-compose

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ira-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  - job_name: ira-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
        labels:
          component: worker

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
