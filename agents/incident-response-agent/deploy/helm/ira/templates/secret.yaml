{{- if and .Values.secrets.create (not .Values.existingSecret) }}
{{- range $k := list "POSTGRES_PASSWORD" "LITELLM_MASTER_KEY" "NEO4J_PASSWORD" }}
{{- if not (hasKey $.Values.secrets.data $k) }}
{{- fail (printf "secrets.data.%s is required when secrets.create=true" $k) }}
{{- end }}
{{- end }}
# Dev/test convenience only: prefer existingSecret managed outside Helm.
# A hook so it exists before the pre-install migration Job runs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ira.secretName" . }}
  labels:
    {{- include "ira.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
