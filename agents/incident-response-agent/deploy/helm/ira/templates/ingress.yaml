{{- if .Values.ingress.enabled }}
{{- $api := include "ira.componentName" (dict "ctx" $ "component" "api") }}
{{- $fe := include "ira.componentName" (dict "ctx" $ "component" "frontend") }}
# One host: /v1 and /health -> api, / -> frontend. /metrics is intentionally not routed
# (scraped in-cluster only); /health/* only reports up/down.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ira.fullname" . }}
  labels:
    {{- include "ira.labels" (dict "ctx" $ "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ default (printf "%s-tls" (include "ira.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fe }}
                port:
                  name: http
          {{- end }}
{{- end }}
