[project]
name = "incident-response-agent"
version = "0.1.0"
description = "AI-driven Incident Response Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "langgraph>=0.0.35",
    "litellm>=1.35.0",
    "redis>=5.0.3",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "neo4j>=5.19.0",
    "alembic>=1.13.1",
    "sqlalchemy>=2.0.29",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "playwright>=1.43.0",
    "sqlglot>=23.6.3",
    "drain3>=0.9.11",
    "presidio-analyzer>=2.2.353",
    "presidio-anonymizer>=2.2.353",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "prometheus-client>=0.21",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "en-core-web-lg",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
    "fakeredis>=2.26",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ira"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
# src/ has no __init__.py files (namespace packages)
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["pandas.*", "yaml.*", "presidio_analyzer.*", "presidio_anonymizer.*", "pgvector.*", "litellm.*"]
ignore_missing_imports = true

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
