[project]
name = "llm-rag-agent-agentic"
version = "0.1.0"
description = "LLM vs RAG vs AI agent vs agentic AI explainer with runnable examples"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40,<2",
  "chromadb>=0.5,<1",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
